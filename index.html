<!doctype html>
<html lang="en" class="dark preload-no-transition">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%images/picko-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07070a" />
    <script>
      ;(() => {
        const root = document.documentElement
        let theme = 'dark'

        try {
          const stored = localStorage.getItem('theme')
          if (stored === 'light' || stored === 'dark') {
            theme = stored
          } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
            theme = 'light'
          }
        } catch {
          if (window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light'
        }

        root.dataset.theme = theme
        root.classList.toggle('dark', theme === 'dark')
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', theme === 'light' ? '#f4f1eb' : '#07070a')
      })()
    </script>
    <meta
      name="description"
      content="Charlie Nozares — Full Stack Developer building modern web applications with Laravel, React, TypeScript, and AI."
    />
    <title>Charlie Nozares — Full Stack Developer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
