<!doctype html>
<html lang="en" class="preload-no-transition">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Staz Cid — Full Stack Developer portfolio. Projects, experience, and contact."
    />
    <title>Staz Cid — Portfolio</title>
    <script>
      ;(function () {
        var theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        try {
          var stored = localStorage.getItem('theme')
          if (stored === 'light' || stored === 'dark') theme = stored
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme)
        document.documentElement.classList.toggle('dark', theme === 'dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
