<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Profile placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111c33"/>
      <stop offset="100%" stop-color="#0a1122"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Soft vignette light from top -->
  <ellipse cx="200" cy="60" rx="220" ry="150" fill="url(#rim)"/>

  <!-- Neutral abstract avatar silhouette (not a real person) -->
  <g fill="#1c2b47">
    <circle cx="200" cy="160" r="66"/>
    <path d="M200 244c-58 0-104 33-104 74v42h208v-42c0-41-46-74-104-74z"/>
  </g>

  <!-- Subtle initials -->
  <text x="200" y="360" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="15" letter-spacing="4" fill="#3b82f6" opacity="0.55">REPLACE ME</text>
</svg>
